name: Backend Tests

on:
  push:
    branches:
      - l4lstore-deployment
  pull_request:
    branches:
      - l4lstore-deployment

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: mern-shop/backend

    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/L4Lstore_test
      JWT_SECRET: ci-only-test-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mern-shop/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
