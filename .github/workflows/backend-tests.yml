name: Backend Tests

on:
  push:
    branches:
      - l4lstore-deployment
  workflow_dispatch:
  pull_request:
    branches:
      - l4lstore-deployment

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: mern-shop/backend

    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/L4Lstore_test?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-only-test-secret
      NODE_ENV: test
      R2_ACCOUNT_ID: ci-account
      R2_ACCESS_KEY_ID: ci-access-key
      R2_SECRET_ACCESS_KEY: ci-secret-key
      R2_BUCKET_NAME: ci-bucket
      R2_PUBLIC_URL: https://images.example.test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mern-shop/backend/package-lock.json

      - name: Start disposable MongoDB replica set
        run: docker compose -f ../docker-compose.yml up -d --wait --wait-timeout 90

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Verify seeded API starts from local setup
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/mern-shop-smoke?replicaSet=rs0&directConnection=true
        run: |
          npm run seed
          npm start > /tmp/l4l-api-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/api/health; then break; fi
            sleep 1
          done
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('http://localhost:5000/api/products');
          assert.equal(response.status, 200);
          const products = await response.json();
          assert.ok(Array.isArray(products) && products.length > 0);
          assert.equal(products[0].currency, 'VND');
          console.log('Seeded API startup and product list passed');
          JS

      - name: MongoDB logs on failure
        if: failure()
        run: docker compose -f ../docker-compose.yml logs mongodb

      - name: Stop test database
        if: always()
        run: docker compose -f ../docker-compose.yml down --volumes
