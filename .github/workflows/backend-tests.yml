name: Backend Tests

on:
  push:
    branches:
      - l4lstore-deployment
  workflow_dispatch:
  pull_request:
    branches:
      - l4lstore-deployment

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: mern-shop/backend

    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/L4Lstore_test?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-only-test-secret
      NODE_ENV: test
      R2_ACCOUNT_ID: ci-account
      R2_ACCESS_KEY_ID: ci-access-key
      R2_SECRET_ACCESS_KEY: ci-secret-key
      R2_BUCKET_NAME: ci-bucket
      R2_PUBLIC_URL: https://images.example.test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mern-shop/backend/package-lock.json

      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name ci-mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec ci-mongodb mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 2
          done
          docker exec ci-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec ci-mongodb mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: MongoDB logs on failure
        if: failure()
        run: docker logs ci-mongodb

      - name: Stop test database
        if: always()
        run: docker rm -f ci-mongodb
